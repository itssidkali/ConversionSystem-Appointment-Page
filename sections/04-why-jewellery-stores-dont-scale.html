<!-- ConversionSystem™ — Why Most Jewellery Stores Don't Scale -->

<section id="csScaleClean">
  <div class="csc-wrap">

    <p class="csc-kicker">WHY MOST JEWELLERY STORES DON'T SCALE</p>

    <h2 class="csc-title">
      <span>Beautiful Stores Create</span>
      <em>Attention.</em>
      <strong>Powerful Buying Experiences Create <b>Sales.</b></strong>
    </h2>

    <!-- ATTENTION → PURCHASE SHIFT -->
    <div class="csc-shift" aria-label="Attention to Purchase">
      <span class="csc-shift-word csc-shift-attention">Attention</span>

      <svg class="csc-arrow" viewBox="0 0 120 20" aria-hidden="true">
        <path class="csc-arrow-base" d="M2 10 H104 M96 4 L106 10 L96 16"></path>
        <path class="csc-arrow-live" d="M2 10 H104 M96 4 L106 10 L96 16"></path>
      </svg>

      <span class="csc-shift-word csc-shift-purchase">Purchase</span>
    </div>

    <div class="csc-1234" aria-label="The four parts of the buying experience">

      <div class="csc-step">
        <span class="csc-num">01</span>
        <b><span class="csc-the">The</span> First Impression</b>
      </div>

      <div class="csc-step">
        <span class="csc-num">02</span>
        <b><span class="csc-the">The</span> Buying Psychology</b>
      </div>

      <div class="csc-step csc-focus">
        <span class="csc-num">03</span>
        <b><span class="csc-the">The</span> Conversion Engine</b>
      </div>

      <div class="csc-step">
        <span class="csc-num">04</span>
        <b><span class="csc-the">The</span> Growth Loop</b>
      </div>

    </div>

  </div>
</section>

<script>
(function(){
  var sec = document.getElementById('csScaleClean');
  if(!sec) return;

  function play(){
    sec.classList.remove('csc-in');
    void sec.offsetWidth;
    sec.classList.add('csc-in');
  }

  if('IntersectionObserver' in window){
    new IntersectionObserver(function(entries, observer){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          play();
          observer.unobserve(entry.target);
        }
      });
    }, {threshold:.14}).observe(sec);
  }else{
    play();
  }
})();
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600&display=swap');

  --soft:#A7A7AD;

  --ease:cubic-bezier(.16,1,.3,1);

  max-width:100vw;
  margin-left:calc(50% - 50vw);
  margin-right:calc(50% - 50vw);

  position:relative;
  overflow:hidden;

  background:var(--paper);
  color:var(--ink);

  font-family:'Inter',system-ui,-apple-system,sans-serif;
  text-align:center;

  padding:clamp(46px,5.8vh,66px) clamp(18px,5vw,60px) clamp(40px,4.8vh,52px);
}

#csScaleClean *,
#csScaleClean *::before,
#csScaleClean *::after{
  box-sizing:border-box;
}

#csScaleClean .csc-wrap{
  width:100%;
  max-width:1080px;
  margin:0 auto;
}

/* KICKER */

  font-weight:800;
  letter-spacing:.27em;

  color:#9A9AA0;

  transform:translateY(8px);

    opacity .5s ease .02s,
    transform .7s var(--ease) .02s;
}

#csScaleClean.csc-in .csc-kicker{
  opacity:1;
  transform:none;
}

/* HEADLINE */
#csScaleClean .csc-title{

  letter-spacing:-.075em;
}

#csScaleClean .csc-title > span{

}

#csScaleClean .csc-title > em{

  color:var(--ink);

  opacity:0;
  transform:translateY(19px);

    transform .84s var(--ease) .31s;
}

/* ATTENTION → PURCHASE SHIFT */
#csScaleClean .csc-shift{
  width:100%;
  margin:clamp(25px,3.6vh,38px) auto 0;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:clamp(14px,2.2vw,28px);

  opacity:0;
  transform:translateY(10px);
  transition:opacity .65s ease .48s,transform .75s var(--ease) .48s;
}

#csScaleClean.csc-in .csc-shift{
  opacity:1;
  transform:none;
}

#csScaleClean .csc-shift-word{
  font-family:'Archivo',sans-serif;
  font-size:clamp(18px,2.15vw,29px);
  line-height:1;
  font-weight:800;
  letter-spacing:-.03em;
  white-space:nowrap;
}

#csScaleClean .csc-shift-attention{

}

#csScaleClean .csc-shift-purchase{
  color:var(--red);
}

#csScaleClean .csc-arrow{
  width:clamp(58px,7vw,104px);
  height:auto;
  flex:none;
  overflow:visible;
}

#csScaleClean .csc-arrow path{
  fill:none;
  stroke-width:2.4;
  stroke-linecap:round;
  stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}

#csScaleClean .csc-arrow-base{
  stroke:rgba(209,42,32,.16);
}

#csScaleClean .csc-arrow-live{
  stroke:var(--red);
  stroke-dasharray:130;
  stroke-dashoffset:130;
}

#csScaleClean.csc-in .csc-arrow-live{
  animation:cscArrowForwardLoop 2.15s linear 1.0s infinite;
}

#csScaleClean.csc-in .csc-shift-purchase{
  animation:cscPurchasePunch 2.15s linear 1.0s infinite;
  transform-origin:center center;
}

/* Arrow always starts at Attention, travels to Purchase, then resets and starts again. */
@keyframes cscArrowForwardLoop{
  0%{stroke-dashoffset:130;}
  44%{stroke-dashoffset:0;}
  46%{stroke-dashoffset:130;}
  100%{stroke-dashoffset:130;}
}

@keyframes cscPurchasePunch{
  0%,41%{transform:translateX(0) scale(1);}
  44%{transform:translateX(3px) scale(1.14);}
  48%{transform:translateX(0) scale(.98);}
  54%,100%{transform:translateX(0) scale(1);}
}

#csScaleClean .csc-title > strong b{
  position:relative;
  display:inline-block;
  isolation:isolate;
  z-index:1;

  margin-left:.03em;
  padding:5px 12px 7px;

  color:var(--red);
  background:transparent;

  font-size:1.52em;
  line-height:.72;
  font-weight:900;
  vertical-align:baseline;

  transform:translateY(.03em);
}

/* Sales stays visible. Only the red highlight behind it reveals. */
#csScaleClean .csc-title > strong b::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(209,42,32,.16);
  border-radius:4px;
  transform:scaleX(0);
  transform-origin:left center;
  z-index:-1;
}

#csScaleClean .csc-title > strong b::after{
  content:"";
  position:absolute;
  top:0;
  left:-18%;
  width:9px;
  height:100%;
  background:rgba(209,42,32,.28);
  opacity:0;
  transform:skewX(-16deg);
  z-index:0;
}

#csScaleClean.csc-in .csc-title > strong b::before{
  animation:cscSalesHighlightReveal .62s cubic-bezier(.16,1,.3,1) .28s forwards;
}

#csScaleClean.csc-in .csc-title > strong b::after{
  animation:cscSalesHighlightSheen .62s cubic-bezier(.16,1,.3,1) .30s forwards;
}

@keyframes cscSalesHighlightReveal{
  0%{transform:scaleX(0);}
  68%{transform:scaleX(1.04);}
  100%{transform:scaleX(1);}
}

@keyframes cscSalesHighlightSheen{
  0%{opacity:0;left:-18%;}
  12%{opacity:1;}
  72%{opacity:.45;}
  100%{opacity:0;left:112%;}
}

#csScaleClean.csc-in .csc-title > span,
#csScaleClean.csc-in .csc-title > em,
#csScaleClean.csc-in .csc-title > strong{
  opacity:1;

}

/* 01–04 STRIP
   No decorative horizontal rules. */
#csScaleClean .csc-1234{

#csScaleClean.csc-in .csc-1234{

#csScaleClean .csc-step{

#csScaleClean.csc-in .csc-step{

}

#csScaleClean.csc-in .csc-step:nth-child(1){animation-delay:.62s}

@keyframes cscStepIn{
  to{

  }
}

#csScaleClean .csc-step:hover{
