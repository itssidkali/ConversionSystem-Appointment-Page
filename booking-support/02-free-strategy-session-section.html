  <div class="csBook-wrap">

    <div class="csBook-positioning">
      ONLINE SYSTEM BUILDER FOR <span>JEWELLERY BRANDS</span>
    </div>

    <h2 class="csBook-title">
      Book Your Free Strategy Session
    </h2>

    <p class="csBook-sub">
      Pick a time below and let’s identify what’s stopping your jewellery store from converting more of the traffic you already have.
    </p>

    <div class="csBook-value" aria-label="Private Strategy Session Included">
      <div class="csBook-value-main">
        <span class="csBook-value-title">Private Strategy Session</span>
        <span class="csBook-value-included">Included</span>
      </div>

      <div class="csBook-price">
        <span class="csBook-old-price">₹3,000</span>
        <span class="csBook-free">FREE</span>
      </div>
    </div>

    <a class="csBook-btn" href="https://api.leadconnectorhq.com/widget/form/349k6XqxJsWlr88axN4V">
      <span>CLAIM FREE</span>
    </a>

  </div>
</section>

<script>
(function(){
  var sec = document.getElementById('csBook');
  if(!sec) return;

  function activate(){
    sec.classList.add('is-in');
  }

  /*
     Keep the section activated once it has appeared.
     Removing "is-in" when the section leaves the viewport can
     leave the CTA hidden after returning from the booking form.
  */
  if('IntersectionObserver' in window){
    var observer = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          activate();
        }
      });
    },{threshold:.2});

    observer.observe(sec);
  }else{
    activate();
  }

  /* Re-activate safely when the browser restores the page via Back. */
  window.addEventListener('pageshow', function(){
    activate();
  });

  /* Extra safeguard for tab/page restoration. */
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) activate();
  });

  setTimeout(activate, 80);
})();
</script>
